<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hold'em - Esmeralda Club</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="holdem.css">
</head>
<body>

  <div class="app">

    <div class="topbar">
      <div class="saldo">💎 <span class="numero">0</span></div>
      <div class="titulo-juego">Texas Hold'em</div>
      <div class="marca">Esmeralda Club</div>
    </div>

    <div class="contenido">

      <!-- Las cartas del rival (tapadas hasta el final) -->
      <div class="mi-mano">
        <p>Rival</p>
        <div class="cartas-mesa" id="cartas-rival"></div>
      </div>

      <!-- Mesa con las cartas comunes -->
      <div class="mesa">
        <div class="mesa-info">
          <span>Mesa 04</span>
          <span id="bote">Bote: 0</span>
        </div>
        <div class="cartas-mesa" id="cartas-mesa"></div>
      </div>

      <!-- Las cartas del jugador -->
      <div class="mi-mano">
        <div class="cartas-mesa" id="mis-cartas"></div>
        <p>Tu mano: <b id="nombre-mano">-</b></p>
      </div>

      <p class="mensaje" id="mensaje"></p>

      <!-- Botones para jugar -->
      <div class="acciones">
        <button id="btn-check">Check</button>
        <button id="btn-bet" class="principal">Bet</button>
        <button id="btn-fold">Fold</button>
        <button id="btn-nueva">Nueva mano</button>
      </div>

    </div>
  </div>

  <div class="menu">
    <a href="ruleta.html"><span class="icono">🎡</span>Ruleta</a>
    <a href="holdem.html" class="activo"><span class="icono">🃏</span>Hold'em</a>
    <a href="blackjack.html"><span class="icono">🂡</span>Blackjack</a>
    <a href="slot.html"><span class="icono">🎰</span>Slot</a>
    <a href="opciones.html"><span class="icono">⚙️</span>Opciones</a>
  </div>

  <script src="shared.js"></script>
  <script src="cartas.js"></script>
  <script src="holdem.js"></script>
</body>
</html>
